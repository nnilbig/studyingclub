<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>AI 戰情室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: isometric 3D server hall on the left, crew panel on the right; stacks on phones. Same committed dark look as 西區交易室. */
:root{
  --bg:#141722;
  --panel:#191b24;
  --card:#20232e;
  --line:#2c3040;
  --text:#e9ecf2;
  --muted:#8d94a4;
  --gold:#ffd23f;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:14px;left:max(14px,env(safe-area-inset-left,0px));display:flex;gap:8px;pointer-events:none}
.title{pointer-events:auto;display:flex;gap:10px;align-items:center;background:rgba(20,22,32,.86);border:1px solid var(--line);border-radius:8px;padding:5px 12px 5px 6px}
.title b{color:var(--gold);font-size:15px}
.title span{color:var(--muted);font-size:12px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.logo img{width:28px;height:28px;border-radius:6px;display:block}
.tools{position:absolute;right:14px;bottom:14px;display:flex;gap:6px}
.tools button{font:500 12px var(--f-body);color:var(--text);background:rgba(20,22,32,.86);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
.tools button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.tools button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{position:absolute;left:14px;bottom:14px;font-size:12px;color:var(--muted);background:rgba(20,22,32,.7);padding:5px 10px;border-radius:6px;pointer-events:none}

aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.sec{padding:16px 16px 12px}
.sec h2{margin:0 0 10px;font-size:15px;display:flex;align-items:baseline;gap:8px}
.sec h2 small{font-weight:400;color:var(--muted);font-size:12px}
.crew{display:grid;gap:4px}
.member{all:unset;cursor:pointer;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.member:hover{background:#1f2230}
.member:focus-visible{outline:2px solid var(--gold)}
.member[aria-pressed="true"]{background:#23263a;border-color:#3a3f5a}
.member canvas{width:36px;height:36px;image-rendering:pixelated;border-radius:6px}
.member b{font-size:14px;display:block}
.member span{font-size:12px;color:var(--muted)}
.member .st{display:block;font-size:11px;font-family:var(--f-mono);margin-top:1px;color:#3fd17f}
.member .st.off{color:#6b7282}
.sched{display:grid;gap:6px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.sched b{font-size:15px}
.lbl2{font-size:11px;color:var(--muted);letter-spacing:.06em}
.detail{margin-top:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.6;color:var(--muted)}

.report{flex:1;overflow:auto;min-height:0;padding:14px 16px 20px;display:grid;gap:14px;align-content:start}
.rhead{display:grid;grid-template-columns:auto 44px 1fr;gap:10px;align-items:center}
.back{all:unset;cursor:pointer;font-size:13px;color:var(--muted);padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.back:hover{color:var(--text)}.back:focus-visible{outline:2px solid var(--gold)}
.rhead canvas{width:44px;height:44px;image-rendering:pixelated;border-radius:8px}
.rhead b{display:block;font-size:16px}
.rhead span{font-size:12px;color:var(--muted)}
.rmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px}
.chip.demo{color:#e8c56b;border-color:#5a4a26}
.chip.ok{color:#3fd17f;border-color:#235a3a}
.rsum{margin:0;padding:10px 12px;border-radius:8px;background:var(--card);border-left:3px solid var(--acc,#ffd23f);font-size:14px;line-height:1.65}
.rlist{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:13.5px;line-height:1.6;color:#d7dbe4}
.rlist li::marker{color:var(--acc,#ffd23f)}
.lbl{font-size:12px;color:var(--muted);margin-bottom:-6px}
.readbtn{all:unset;cursor:pointer;margin-left:auto;font-size:12px;color:var(--gold);border:1px solid #5a4a26;border-radius:999px;padding:2px 10px}
.readbtn:focus-visible{outline:2px solid var(--gold)}
.rmeta select{font:12px var(--f-mono);background:#12141c;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.art{display:grid;gap:12px;min-width:0}
.atag{font-size:11px;color:var(--acc,var(--gold));letter-spacing:.06em}
.atitle{margin:-6px 0 0;font-size:17px;line-height:1.45;text-wrap:balance}
.art section{min-width:0}
.art h4{margin:4px 0 6px;font-size:13.5px;color:var(--acc,var(--gold))}
.art p{margin:0 0 8px;font-size:13.5px;line-height:1.8;color:#d7dbe4;overflow-wrap:anywhere}
.rsrc{font-size:12px;color:var(--muted)}.rsrc a{color:#9aa6c0;overflow-wrap:anywhere}
.rsrc ul{margin:4px 0 0;padding-left:1.2em;display:grid;gap:2px}
.reader{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.rbar{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:12px;background:rgba(20,23,34,.94);border-bottom:1px solid var(--line);padding-block:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rbar span{font-size:12px;color:var(--muted);font-family:var(--f-mono);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbody{max-width:680px;margin:0 auto;padding-top:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rbody .atitle{font-size:24px}
.rbody .art{gap:16px}
.rbody .art p,.rbody .rlist{font-size:16px;line-height:1.9}
.rbody .art h4{font-size:16px;margin-top:10px}
.rbody .rsum{font-size:15px}
.note{margin:0;color:var(--muted);font-size:12.5px;line-height:1.7;padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
@media (max-width:860px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:56vh auto;height:auto}
  .report{overflow:visible}
  aside{border-left:0;border-top:1px solid var(--line)}
  .hint{display:none}
  .sec,.report{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
</style>
</head>
<body>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="AI 戰情室 3D 等角機房：伺服器機櫃、螢幕牆與五個研究座位，點選貓咪可查看研究主題"></canvas>
    <div class="hud"><div class="title"><span id="logo" class="logo"></span><b>AI 戰情室</b><span id="clock">--:--</span></div></div>
    <div class="hint">拖曳旋轉・滾輪縮放・點貓咪看研究主題</div>
    <div class="tools">
      <button id="pxBtn" aria-pressed="false">像素感</button>
      <button id="resetBtn">回到預設視角</button>
    </div>
  </div>
  <aside>
    <div class="sec" id="home">
      <h2>研究員 <small>5 席</small></h2>
      <div class="crew" id="crew"></div>
      <div class="detail">點選貓咪或名單，看牠負責的研究主題。</div>
    </div>
    <div class="report" id="report" hidden></div>
  </aside>
</div>

<div class="reader" id="reader" hidden role="dialog" aria-label="閱讀內容"><div class="rbar"><button class="back" id="rclose">← 回戰情室</button><span id="rwho"></span></div><div class="rbody" id="rbody"></div></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const stage=document.getElementById("stage"),canvas=document.getElementById("gl");

/* ---------- crew ---------- */
const CREW={

    fur:"#efe3cd",furL:"#fffaf0",mask:"#5a3d2c",ear:"#5a3d2c",tailTip:"#5a3d2c",eye:"#5ab0f0",shirt:"#2b4f7a",acc:"#3ad7ff",pants:"#2a2f45",

    items:["250–350 字英文文章，附 6–8 個單字","一個文法重點，含練習與解答","每週 2–3 次口語版 Casual English"]},
  books:{name:"Page",role:"三花貓・書籍推薦",col:"#ff8f7a",
    fur:"#f6f3ee",furL:"#ffffff",patchA:"#e8913a",patchB:"#2f2a2a",earL:"#e8913a",earR:"#2f2a2a",tailTip:"#2f2a2a",eye:"#c9a548",shirt:"#3a9a8a",acc:"#fff2c8",pants:"#3a3a48",
    scheme:{bg:"#2e1614",dots:["#ff8f7a","#fff2c8","#ffc9b8"],glow:"#ff8f7a"},kind:"book",
    sched:{name:"每日今日故事",when:"每天 21:23",out:"Gmail「今日故事」",near:true},
    scope:"每天找一則跟今天日期有關的有趣故事：歷史、文學、藝術、音樂、科學都可以。",
    items:["發生在今天、今天生日或今天問世的人事物","挑最有趣的，不一定是最有名的","附「延伸」閱讀建議與資料來源"]},
  music:{name:"Coda",role:"藍貓・音樂賞析",col:"#c9a9ff",
    fur:"#7b8b9c",furL:"#a9b6c4",eye:"#8fd06a",shirt:"#5a4690",acc:"#c9a9ff",pants:"#2a2a33",
    scheme:{bg:"#1d1430",dots:["#c9a9ff","#ffffff","#8a5cc2"],glow:"#b07bff",off:true},kind:"music",
    scope:"每次導聆一張專輯或一首曲子，拆解編曲與聽點，再推薦相近風格。",
    items:["一張專輯導聆","編曲與和聲的聽點","相似風格推薦"]}
};
const ORDER=["ai","tech","news","books","music"];

/* ---------- pixel avatar (2D) ---------- */
const FACE=[".kk..........kk.",".kfk........kfk.",".kfPkkkkkkkkPfk.",".kfffzffffzfffk.",".kffzffffffzffk.",".kffyyffffyyffk.",".kffyeffffeyffk.",".kffffffffffffk.",".kFfffcPPcfffFk.",".kfFFffffffFFfk.","..kffffffffffk..","...kkffffffkk...","..kvvvvaavvvvk..",".kvvvvvaavvvvvk.","kfvvvvvvvvvvvvfk"];
function avatar(c,bg){const cv=document.createElement("canvas");cv.width=16;cv.height=16;const t=cv.getContext("2d");t.fillStyle=bg;t.fillRect(0,0,16,16);
  const pal={k:"#1d1820",f:c.fur,F:c.mask||c.furL,z:c.stripe||c.patchA||c.fur,P:"#f1b6c4",y:c.eye,e:"#1d1820",c:"#e89aa8",v:c.shirt,a:c.acc};
  FACE.forEach((r,j)=>{for(let i=0;i<16;i++){const ch=r[i];if(ch!=="."&&pal[ch]){t.fillStyle=pal[ch];t.fillRect(i,j+1,1,1)}}});
  if(c.patchB){t.fillStyle=c.patchB;t.fillRect(9,4,3,2);t.fillRect(11,3,2,1)}
  if(c.kind==="music"){t.fillStyle="#2a2a33";t.fillRect(2,1,12,1);t.fillRect(1,2,1,7);t.fillRect(14,2,1,7);t.fillStyle=c.acc;t.fillRect(0,5,2,4);t.fillRect(14,5,2,4)}
  return cv}

/* ---------- renderer ---------- */
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color("#141722");
const camera=new THREE.OrthographicCamera(-10,10,6,-6,-100,200);
const W=15,D=11,H=3.2;
const TARGET=new THREE.Vector3(7.8,0.6,5.8);
const camDir=new THREE.Vector3(1,0.816,1).normalize();
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minAzimuthAngle=Math.PI/4-0.75;controls.maxAzimuthAngle=Math.PI/4+0.75;
controls.minPolarAngle=0.75;controls.maxPolarAngle=1.15;
controls.minZoom=0.7;controls.maxZoom=3;controls.screenSpacePanning=true;
function resetCam(){camera.position.copy(TARGET).addScaledVector(camDir,60);camera.zoom=1;camera.updateProjectionMatrix();controls.target.copy(TARGET);controls.update()}
resetCam();

const PXON=innerWidth<600?2:3;let PX=1;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  const dpr=PX===1?Math.min(2,devicePixelRatio||1):1/PX;renderer.setSize(Math.max(1,Math.floor(w*dpr)),Math.max(1,Math.floor(h*dpr)),false);
  const aspect=w/h,viewH=Math.max(15,21/aspect);
  camera.left=-viewH*aspect/2;camera.right=viewH*aspect/2;camera.top=viewH/2;camera.bottom=-viewH/2;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);

/* ---------- lights (a touch cooler than the trading room) ---------- */
scene.add(new THREE.HemisphereLight("#f2f6ff","#3a3f50",1.1));
const sun=new THREE.DirectionalLight("#fff4e0",1.35);sun.position.set(-8,16,12);sun.target.position.set(7.5,0,5.5);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:60});sun.shadow.bias=-0.0008;
scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight("#cfe0ff",0.4);fill.position.set(20,10,20);scene.add(fill);

/* ---------- helpers ---------- */
const mats={};
const mat=(c,o={})=>{const k=c+JSON.stringify(o);return mats[k]||(mats[k]=new THREE.MeshLambertMaterial({color:c,...o}))};
function box(w,h,d,c,x,y,z,parent=scene,opt={}){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==="string"?mat(c):c);
  m.position.set(x+w/2,y+h/2,z+d/2);m.castShadow=opt.cast!==false;m.receiveShadow=true;parent.add(m);return m}
function ctex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;const t=c.getContext("2d");draw(t,w,h);
  const tx=new THREE.CanvasTexture(c);tx.magFilter=THREE.NearestFilter;tx.minFilter=THREE.NearestFilter;tx.colorSpace=THREE.SRGBColorSpace;tx.userData={c,t};return tx}
function plane(w,h,material,x,y,z,ry=0,parent=scene){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),material);m.position.set(x,y,z);m.rotation.y=ry;parent.add(m);return m}
function noShadow(m){m.castShadow=false;return m}

/* ---------- raised floor ---------- */
const tile=ctex(32,32,(t)=>{
  t.fillStyle="#d6dae1";t.fillRect(0,0,32,32);
  t.fillStyle="#c3c8d1";for(let y=4;y<30;y+=4)for(let x=4;x<30;x+=4)t.fillRect(x,y,1,1);
  t.fillStyle="#aeb4bf";t.fillRect(0,0,32,1);t.fillRect(0,0,1,32);
  t.fillStyle="#eceff3";t.fillRect(0,1,32,1);t.fillRect(1,0,1,32);
});
tile.wrapS=tile.wrapT=THREE.RepeatWrapping;tile.repeat.set(W/1.2,D/1.2);
const floor=new THREE.Mesh(new THREE.BoxGeometry(W,0.3,D),new THREE.MeshLambertMaterial({map:tile}));floor.position.set(W/2,-0.15,D/2);floor.receiveShadow=true;scene.add(floor);
/* cold aisle in front of racks */
const cold=ctex(16,16,(t)=>{t.fillStyle="#a9cdf0";t.fillRect(0,0,16,16);t.fillStyle="#8fb8e0";for(let y=2;y<16;y+=3)for(let x=2;x<16;x+=3)t.fillRect(x,y,1,1);t.fillStyle="#7fa6cf";t.fillRect(0,0,16,1);t.fillRect(0,0,1,16)});
cold.wrapS=cold.wrapT=THREE.RepeatWrapping;
{const c1=cold.clone();c1.needsUpdate=true;c1.repeat.set(7,0.6);const m=new THREE.Mesh(new THREE.BoxGeometry(8.8,0.02,0.75),new THREE.MeshLambertMaterial({map:c1}));m.position.set(1.25+4.4,0.01,1.2+0.375);m.receiveShadow=true;scene.add(m)}
{const c2=cold.clone();c2.needsUpdate=true;c2.repeat.set(0.6,7);const m=new THREE.Mesh(new THREE.BoxGeometry(0.75,0.02,8.6),new THREE.MeshLambertMaterial({map:c2}));m.position.set(1.2+0.375,0.01,1.3+4.3);m.receiveShadow=true;scene.add(m)}

/* ---------- walls ---------- */
const wallL=mat("#dfe6ee"),wallB=mat("#cdd6e0");
noShadow(box(0.2,H,D+0.2,wallL,-0.2,0,-0.2));
noShadow(box(W,H,0.2,wallB,0,0,-0.2));
box(0.06,0.18,D,"#b6c0cc",0,0,0,scene,{cast:false});box(W,0.18,0.06,"#a9b3bf",0,0,0,scene,{cast:false});
noShadow(box(0.28,0.1,D+0.28,"#8d97a6",-0.24,H,-0.24));noShadow(box(W+0.04,0.1,0.28,"#8d97a6",0,H,-0.24));

/* ---------- server racks ---------- */

  reportEl.innerHTML=h;
  document.getElementById("rav").replaceWith(avatar(c,"#23263a"));document.getElementById("back").onclick=closeReport;
  const ds=document.getElementById("dsel");if(ds)ds.onchange=()=>{curDate[k]=ds.value;openReport(k)};
  if(date){const art=document.getElementById("art");
    loadDoc(k,date).then(d=>{if(openK!==k||!art.isConnected)return;art.innerHTML=articleHTML(d);
      document.getElementById("readbtn").onclick=()=>openReader(c,date,art.innerHTML)})
    .catch(()=>{if(art.isConnected)art.innerHTML=`<p class="note">這份內容暫時讀不到，請稍後重新整理。</p>`})}
}
const reader=document.getElementById("reader"),rbody=document.getElementById("rbody");
function openReader(c,date,html){reader.style.setProperty("--acc",c.col);document.getElementById("rwho").textContent=`${c.name}・${c.role.split("・")[1]||""}・${dateLabel(date)}`;rbody.innerHTML=html;reader.hidden=false;reader.scrollTop=0;document.getElementById("rclose").focus()}
function closeReader(){reader.hidden=true}
document.getElementById("rclose").onclick=closeReader;
addEventListener("keydown",e=>{if(e.key==="Escape"&&!reader.hidden)closeReader()});
async function loadIndex(){const r=await fetch(`reports/index.json?t=${Date.now()}`);if(!r.ok)throw new Error("http "+r.status);const idx=await r.json();
  const sig=JSON.stringify(idx.reports||[]);if(sig===idxSig&&repState==="ok")return;idxSig=sig;
  const next={};for(const e of idx.reports||[]){if(!e||!CREW[e.agent]||!/^\d{4}-\d{2}-\d{2}$/.test(e.date||""))continue;(next[e.agent]=next[e.agent]||[]).push(e)}
  for(const k in next)next[k].sort((a,b)=>b.date.localeCompare(a.date));
  byAgent=next;repState="ok";refreshStatus();if(openK)openReport(openK)}
loadIndex().catch(()=>{repState="offline";if(openK)openReport(openK)});
setInterval(()=>{loadIndex().catch(()=>{})},5*60*1000);

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let downAt=null;
function pick(e){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(cats,true)[0];return hit?hit.object.userData.catRoot:null}
canvas.addEventListener("pointerdown",e=>{downAt=[e.clientX,e.clientY]});
canvas.addEventListener("pointerup",e=>{if(!downAt)return;const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]);downAt=null;if(moved>5)return;const c=pick(e);if(c)select(c.userData.key,false)});
canvas.addEventListener("pointermove",e=>{if(e.buttons)return;canvas.style.cursor=pick(e)?"pointer":"grab"});

/* ---------- tools ---------- */
const pxBtn=document.getElementById("pxBtn");
pxBtn.addEventListener("click",()=>{PX=PX===1?PXON:1;pxBtn.setAttribute("aria-pressed",PX!==1);canvas.style.imageRendering=PX!==1?"pixelated":"auto";resize()});
document.getElementById("resetBtn").addEventListener("click",()=>{focusing=0;resetCam()});

/* ---------- clock ---------- */
function tpe(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Taipei"}))}
function tickClock(){const d=tpe();document.getElementById("clock").textContent=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  const hA=((d.getHours()%12)+d.getMinutes()/60)/12*Math.PI*2,mA=d.getMinutes()/60*Math.PI*2;hourH.rotation.z=-hA;minH.rotation.z=-mA}
tickClock();setInterval(tickClock,30000);

/* ---------- loop ---------- */
let last=0,scrT=0,rackT=0,wT=0;
function animate(now){
  requestAnimationFrame(animate);
  const t=now/1000,dt=Math.min(0.05,(now-last)/1000||0);last=now;
  if(!reduce){
    scrT+=dt;if(scrT>0.35){scrT=0;screens.forEach(s=>{if(Math.random()<0.6)drawScreen(s)})}
    rackT+=dt;if(rackT>0.5){rackT=0;rackTexs.forEach(drawRack)}
    wT+=dt;if(wT>0.4){wT=0;wallT++;drawWall()}
    for(const c of cats){const u=c.userData,p=t*2+u.phase;
      u.body.position.y=Math.abs(Math.sin(p*0.8))*0.03;
      u.tail.forEach((s,i)=>{s.rotation.z=Math.sin(p*1.3+i*0.6)*0.25});
      if(u.kind==="work"){u.armL.rotation.x=Math.sin(p*3)*0.25;u.armR.rotation.x=-Math.sin(p*3)*0.25;u.head.rotation.y=Math.sin(p*0.4)*0.15}
      else if(u.kind==="book"||u.kind==="paper"){u.head.rotation.x=0.28+Math.sin(p*0.3)*0.04;u.head.rotation.y=Math.sin(p*0.25)*0.1;u.held.rotation.z=Math.sin(p*0.3)*0.04}
      else if(u.kind==="music"){const beat=Math.sin(t*Math.PI*2*1.6+u.phase);u.head.rotation.z=beat*0.12;u.head.rotation.x=Math.abs(beat)*0.08;u.body.position.y=Math.abs(beat)*0.04;u.armR.rotation.x=-0.3-Math.max(0,beat)*0.4;u.armL.rotation.x=0}
    }
    ring.rotation.z+=dt*1.5;
    coreCube.rotation.y=t*0.8;coreCube.position.y=1.55+Math.sin(t*1.5)*0.06;
    beamMat.opacity=0.13+Math.sin(t*2)*0.04;
    orbs.forEach((o,i)=>{const a=t*0.6+i*Math.PI*2/5;o.position.set(Math.cos(a)*0.8,1.5+Math.sin(t*1.3+i)*0.18,Math.sin(a)*0.8);o.rotation.y=t+i});
  }else orbs.forEach((o,i)=>{const a=i*Math.PI*2/5;o.position.set(Math.cos(a)*0.8,1.5,Math.sin(a)*0.8)});
  if(focusing){controls.target.lerp(focus,0.08);if(controls.target.distanceTo(focus)<0.02)focusing=0}
  controls.update();renderer.render(scene,camera);
}
resize();requestAnimationFrame(animate);
</script>
